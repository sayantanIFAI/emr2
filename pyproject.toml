[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cdi-adapter"
version = "0.1.0"
description = "Clinical Document Intelligence -> EMR/EHR Adapter (ABDM/ABHA-ready, on-prem, OSS)"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.111",
  "uvicorn[standard]>=0.30",
  "python-multipart>=0.0.9",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "SQLAlchemy>=2.0.30",
  "psycopg[binary]>=3.1.19",
  "alembic>=1.13",
  "celery[redis]>=5.4",
  "redis>=5.0",
  "boto3>=1.34",
  "pypdfium2>=4.30,<6",
  "opencv-python-headless>=4.10",
  "numpy>=1.26",
  "Pillow>=10.3",
  "watchdog>=4.0",
  "structlog>=24.1",
  "httpx>=0.27",
  "tenacity>=8.3",
  "jsonschema>=4.22",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2",
  "pytest-cov>=5.0",
  "ruff>=0.4",
  "mypy>=1.10",
]
# S3 printed-OCR engine (ONNX, CPU) - light, no GPU/Paddle
ocr = [
  "rapidocr-onnxruntime>=1.3",
  "onnxruntime>=1.17",
]
# S2/S3 handwriting + S4 extraction: transformers Qwen2.5-VL served by cdi_adapter.mlserve.
# torch is expected preinstalled (RunPod image); torchvision must match it.
ml = [
  "transformers>=4.49",
  "accelerate>=0.34",
  "qwen-vl-utils>=0.0.8",
  "einops>=0.8",
  "sentencepiece>=0.2",
]
# file listener: OneDrive / SharePoint via Microsoft Graph (app-only auth)
listener = [
  "msal>=1.28",
]
# Google Drive connector (CDI_LISTENER_CONNECTOR=gdrive)
gdrive = [
  "google-auth>=2.30",
  "requests>=2.31",
]

[project.scripts]
cdi-ingest-watch = "cdi_adapter.ingest.watcher:main"
cdi-ocrhost = "cdi_adapter.ocrhost.app:main"
cdi-listener = "cdi_adapter.listener.service:main"
cdi-listener-recovery = "cdi_adapter.listener.recovery:main"
cdi-fhir-agent = "cdi_adapter.agents.fhir_builder:main"
cdi-dispatch = "cdi_adapter.agents.dispatch:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
cdi_adapter = ["compliance/*.json", "compliance/licences/*.txt"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "integration: requires Postgres/an S3 object store/Redis (set CDI_DATABASE_URL etc.)",
  "objectstore: needs only a live S3 store (set CDI_S3_ENDPOINT_URL); skips otherwise",
]

# pypdfium2 ships no type stubs
[[tool.mypy.overrides]]
module = ["pypdfium2", "pypdfium2.*"]
ignore_missing_imports = true
